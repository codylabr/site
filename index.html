<!DOCTYPE html>
<!-- Página "Em breve" do Codyla. Fica no ramo em-breve do repositório do site. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codyla · Em breve</title>
<meta name="description" content="O Codyla desenvolve sistemas web simples para resolver tarefas do dia a dia das empresas. Site novo em breve.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preload" href="fonts/mona-sans.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:"Mona Sans";src:url("fonts/mona-sans.woff2") format("woff2");font-weight:200 900;font-display:swap}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Mona Sans",system-ui,sans-serif;color:#D8E8FA;background:#0E2A6E;
       background-image:radial-gradient(ellipse at 85% 110%,#1E4FC0 0%,transparent 60%);
       display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;width:min(760px,100% - 3rem);margin-inline:auto;padding:4rem 0}
  img{width:132px;height:auto;margin-bottom:3.5rem}
  h1{font-size:clamp(3rem,10vw,6.5rem);font-weight:800;font-stretch:112%;line-height:.95;letter-spacing:-.02em;color:#fff}
  .frase{margin-top:1.25rem;font-size:clamp(1.15rem,2.6vw,1.5rem);font-weight:500;color:#3B9CF0}
  p.texto{margin-top:2rem;max-width:34rem;font-size:1.05rem;line-height:1.65}
  a{color:#fff;text-underline-offset:4px}
  a:focus-visible{outline:3px solid #3B9CF0;outline-offset:3px;border-radius:3px}
  footer{width:min(760px,100% - 3rem);margin:0 auto;padding:1.5rem 0 2rem;font-size:.85rem;color:#9DB6DD}
</style>
</head>
<body>
<main>
  <img src="img/logo-branco.png" alt="Codyla" width="480" height="342">
  <h1>Em breve.</h1>
  <p class="frase">Código que resolve.</p>
  <p class="texto">Estamos preparando o novo site do Codyla. Enquanto isso, fale com a gente pelo e-mail <a href="mailto:contato.codyla@gmail.com">contato.codyla@gmail.com</a>.</p>
</main>
<footer>© 2026 Codyla</footer>
</body>
</html>
